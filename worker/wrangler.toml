name = "invest-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

# D1: `npx wrangler d1 create invest` 후 나온 database_id를 아래에 넣는다.
# database_id는 비밀이 아니다(계정 인증 없이는 접근 불가). 커밋해도 된다.
[[d1_databases]]
binding = "DB"
database_name = "invest"
database_id = "50f995f4-8055-4b85-94c5-a90aeba7abf8"
migrations_dir = "migrations"

[vars]
# 스킴+호스트만. 로컬 개발용 Vite 주소 포함.
ALLOW_ORIGINS = "https://likelikelikeit.github.io,http://localhost:5173"
# 스크린샷 인식 LLM (SPEC §10 미정). 공급자는 src/sources/llm.js의 PROVIDERS 키.
# 키 시크릿이 없으면 /import만 501, 나머지는 정상.
IMPORT_LLM_PROVIDER = "anthropic"
# IMPORT_LLM_MODEL = ""   # 비우면 공급자 기본 모델

# 크론 (SPEC §7.3, UTC 고정). 문자열은 src/cron/daily.js의 CRON_KR/CRON_US와 같아야 한다.
# 나머지(거시, 어닝일)는 M7에서 추가한다.
[triggers]
crons = ["0 7 * * 1-5", "0 22 * * 1-5", "0 23 * * SUN"]
